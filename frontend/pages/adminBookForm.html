<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit book | ShelfSync Admin</title>
  <link rel="stylesheet" href="../static/css/global.css">
  <link rel="stylesheet" href="../static/css/pages/manageBooks.css">
  <link rel="stylesheet" href="../static/css/pages/adminBookForm.css">
</head>
<body>
  <div class="admin-form-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div>
          <h3>ShelfSync</h3>
          <p class="paragraph">LIBRARY MANAGEMENT</p>
        </div>
      </div>
      <div class="sidebar-body">
        <nav class="sidebar-menu">
          <a href="adminDashboard.html" class="sidebar-btn">Dashboard</a>
          <a href="adminBookMangement.html" class="sidebar-btn active">My Books</a>
          <a href="adminReviewManagement.html" class="sidebar-btn">Reviews</a>
          <a href="adminBorrowRequests.html" class="sidebar-btn">Borrow requests</a>
          <a href="adminManageUsers.html" class="sidebar-btn">Users</a>
          <a href="adminProfile.html" class="sidebar-btn">Profile</a>
          <a href="adminSettings.html" class="sidebar-btn">Settings</a>
          <button type="button" class="sidebar-btn" data-admin-logout>Logout</button>
        </nav>
      </div>
    </aside>

    <main class="admin-form-main">
      <h1 id="form-title">Add book</h1>
      <p class="admin-form-sub" id="form-subtitle">Create a new catalog entry. All fields except title and author are optional.</p>

      <form id="book-form" class="book-form">
        <div>
          <label for="title">Title</label>
          <input id="title" name="title" required maxlength="512" autocomplete="off">
        </div>
        <div>
          <label for="author">Author</label>
          <input id="author" name="author" required maxlength="255" autocomplete="off">
        </div>
        <div class="form-row-2">
          <div>
            <label for="isbn">ISBN</label>
            <input id="isbn" name="isbn" maxlength="32">
          </div>
          <div>
            <label for="publication_year">Publication year</label>
            <input id="publication_year" name="publication_year" type="number" min="1000" max="2100" placeholder="e.g. 1925">
          </div>
        </div>
        <div>
          <label for="category_slug">Category slug</label>
          <input id="category_slug" name="category_slug" placeholder="e.g. fiction (must exist in database)">
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Synopsis or catalog notes"></textarea>
        </div>
        <div>
          <label for="cover_url">Cover image URL</label>
          <input id="cover_url" name="cover_url" type="url" placeholder="https://…">
        </div>
        <div class="form-row-2">
          <div>
            <label for="total_copies">Total copies</label>
            <input id="total_copies" name="total_copies" type="number" min="1" value="1" required>
          </div>
          <div>
            <label for="available_copies">Available copies</label>
            <input id="available_copies" name="available_copies" type="number" min="0" value="1" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Save book</button>
          <a class="btn btn-ghost" href="adminBookMangement.html">Cancel</a>
        </div>
      </form>
    </main>
  </div>
  <script type="module" src="../static/js/pages/adminBookForm.js"></script>
</body>
</html>
