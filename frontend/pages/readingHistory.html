<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading History | ShelfSync</title>
  <link rel="stylesheet" href="../static/css/global.css">
  <link rel="stylesheet" href="../static/css/pages/readingHistory.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar__inner">
      <span class="navbar__brand" id="navbar__brand">ShelfSync</span>
      <div class="navbar__links">
        <a href="../index.html">Home</a>
        <a href="searchBooks.html">Browse</a>
        <a href="userDashboard.html">Dashboard</a>
        <a href="readingHistory.html" style="color: var(--ink);">History</a>
      </div>
      <div class="navbar__actions">
        <button class="btn-login" id="btn-nav">Profile</button>
        <div class="navbar__avatar"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <section class="hero">
      <h1 class="hero__title">Reading Journey</h1>
      <p class="hero__subtitle">Track your completed books and reading statistics</p>
    </section>

    <!-- Statistics Section -->
    <section class="statistics">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card__value" id="totalBooks">0</div>
          <div class="stat-card__label">Books Read</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value" id="totalPages">0</div>
          <div class="stat-card__label">Total Pages</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value" id="avgRating">0.0</div>
          <div class="stat-card__label">Avg Rating</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value" id="readingMonth">0</div>
          <div class="stat-card__label">This Month</div>
        </div>
      </div>
    </section>

    <!-- Filter Section -->
    <section class="filters">
      <div class="filters__inner">
        <div class="filter-group">
          <label class="filter-label">Sort By</label>
          <div class="select-wrap">
            <select id="sortFilter">
              <option value="date-completed">Date Completed</option>
              <option value="title">Title</option>
              <option value="rating">Rating</option>
              <option value="pages">Pages</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <button class="btn-refine" id="applySortFilter">Apply</button>
      </div>
    </section>

    <!-- Timeline Section -->
    <section class="timeline">
      <div id="timelineContainer" class="timeline-list">
        <!-- Timeline items will be loaded here -->
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <p class="empty-state__text">No reading history yet. Start reading!</p>
        <a href="searchBooks.html" class="btn btn-primary">Explore Books</a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <span class="footer__brand">ShelfSync</span>
        <p class="footer__copy">&copy; 2026 ShelfSync. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="../static/js/pages/readingHistory.js"></script>
</body>

</html>
