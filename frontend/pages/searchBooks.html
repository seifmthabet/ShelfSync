<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse catalog | ShelfSync</title>
    <link rel="stylesheet" href="../static/css/global.css">
    <link rel="stylesheet" href="../static/css/pages/searchBooks.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar__inner">
            <a href="../index.html" class="navbar__brand" id="navbar__brand">ShelfSync</a>
            <nav class="navbar__links">
                <a href="../index.html">Home</a>
                <a href="searchBooks.html" id="browse">Browse</a>
                <a href="about.html">About</a>
                <a href="how-it-works.html">How it works</a>
            </nav>
            <div class="navbar__actions">
                <a href="loginPage.html" id="btn-login">Login</a>
                <a href="loginPage.html" id="btn-nav" class="navbar__avatar-link">Profile</a>
                <div class="navbar__avatar" aria-hidden="true"></div>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 class="hero__title">
                Browse the <em>catalog</em>
            </h1>
            <p class="hero__lead">Search titles and authors, filter by collection and availability.</p>
        </div>
    </section>

    <div class="filters">
        <div class="container filters__inner">
            <div class="filter-group">
                <label class="filter-label" for="catalog-search">Search</label>
                <div class="search-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input id="catalog-search" type="search" placeholder="Title, author, or ISBN…" autocomplete="off">
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="category-filter">Collection</label>
                <div class="select-wrap">
                    <select id="category-filter">
                        <option value="">All collections</option>
                    </select>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="availability-filter">Availability</label>
                <div class="select-wrap">
                    <select id="availability-filter">
                        <option>All</option>
                        <option>In Stock</option>
                        <option>Out of Stock</option>
                    </select>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <button type="button" class="btn-refine">Apply filters</button>
        </div>
    </div>

    <main class="container main-grid" aria-live="polite">
    </main>

    <div class="pagination">
        <div class="container pagination__inner">
            <button type="button" class="page-nav" disabled>← Previous</button>
            <div class="page-numbers"></div>
            <button type="button" class="page-nav">Next →</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer__inner">
            <span class="footer__brand">ShelfSync</span>
            <span class="footer__copy">&copy; 2026 ShelfSync</span>
        </div>
    </footer>
    <script type="module" src="../static/js/pages/searchBooks.js"></script>
</body>
</html>
