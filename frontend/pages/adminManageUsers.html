<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | ShelfSync Admin</title>
  <link rel="stylesheet" href="../static/css/global.css">
  <link rel="stylesheet" href="../static/css/pages/adminManageUsers.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar__inner">
      <span class="navbar__brand" id="navbar__brand">ShelfSync Admin</span>
      <div class="navbar__links">
        <a href="adminDashboard.html">Dashboard</a>
        <a href="adminManageUsers.html" style="color: var(--ink);">Users</a>
        <a href="adminBookMangement.html">Books</a>
        <a href="adminBorrowRequests.html">Borrow Requests</a>
        <a href="adminReviewManagement.html">Reviews</a>
        <a href="adminProfile.html">Profile</a>
        <a href="adminSettings.html">Settings</a>
      </div>
      <div class="navbar__actions">
        <button class="btn-login" type="button" id="btn-logout" data-admin-logout>Logout</button>
        <div class="navbar__avatar"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <section class="hero">
      <h1 class="hero__title">Manage Users</h1>
      <p class="hero__subtitle">View user accounts, roles, and statistics</p>
    </section>

    <!-- Search & Filter Section -->
    <section class="filters">
      <div class="filters__inner">
        <div class="filter-group search-box">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 10L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by name or email..." class="search-box-input">
        </div>

        <div class="filter-group">
          <label class="filter-label">Role</label>
          <div class="select-wrap">
            <select id="roleFilter">
              <option value="">All Roles</option>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Status</label>
          <div class="select-wrap">
            <select id="statusFilter">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <button class="btn-refine" id="applyFilters">Apply Filters</button>
      </div>
    </section>

    <!-- Users Table -->
    <section class="users-section">
      <div id="usersContainer" class="users-table">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Joined</th>
              <th>Active Loans</th>
              <th>Reviews</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Users will be loaded here -->
          </tbody>
        </table>
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <p class="empty-state__text">No users found.</p>
      </div>
    </section>

    <!-- Pagination -->
    <section class="pagination">
      <div class="pagination__inner">
        <button class="page-nav" id="prevPage">← Previous</button>
        <div class="page-numbers" id="pageNumbers"></div>
        <button class="page-nav" id="nextPage">Next →</button>
      </div>
    </section>
  </main>

  <!-- Modal for User Details -->
  <div id="userModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>User Details</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- User details will be loaded here -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="closeModalBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <span class="footer__brand">ShelfSync</span>
        <p class="footer__copy">&copy; 2026 ShelfSync. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="../static/js/pages/adminManageUsers.js"></script>
</body>

</html>
