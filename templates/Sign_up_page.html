<!Doctype html>
<html>

<head>
    <title>Sign Up</title>
    <meta name="author" content="Abdullah Basyouni">
</head>

<body>
    <div class="Content">
        <header class="Header_Sign_Up">
            <div id="rightContent_H">
                <img src="" alt="Logo" width="32px" height="32px" id="Logo">
                <h2 id="web_name">Shelf Sync</h2>
            </div>
            <div id="leftContent_H">
                <p id="Question_H">Already have an account?</p>
                <a href="login.html">
                    <button type="button">Login</button>
                </a>
            </div>
        </header>
        <hr>


        <main class="Main_Sign">
            <section class="Background_Border">
                <div id="margin_form">
                    <div id="container_Sign_H">
                        <h1 id="Form_title">Create Account</h1>
                        <small id="Small_Write">Join our community of readers today.</small>
                    </div>
                </div>
                <br>
                <div id="Form_SignMargin">
                    <div id="Form_SignUp">
                        <form action="">
                            <div id="FullN">
                                <label for="Full_Name"><b>Full Name</b></label><br>
                                <input type="text" name="fullN" id="Full_Name" placeholder="Enter your full name"
                                    required>
                            </div>
                            <br>
                            <div id="Email_sign">
                                <label for="Email_S"><b>Email Address</b></label><br>
                                <input type="email" name="EmailAdd" id="Email_S" placeholder="name@example.com"
                                    required>
                            </div>
                            <br>
                            <div id="Password_sign">
                                <label for="password_S"><b>Password</b></label><br>
                                <input type="password" name="Pass" id="Password_S" placeholder="Create a password"
                                    required>
                                <button type="button">Show</button>
                            </div>
                            <br>
                            <div id="ConfirmPassword_sign">
                                <label for="ConfirmPassword"><b>Confirm Password</b></label><br>
                                <input type="password" name="comfirmpass" id="ConfirmPassword"
                                    placeholder="Repeat your password" required>
                                <button type="button">Show</button>
                            </div>
                            <br>
                            <div id="SelectRole">
                                <label id="RoleLabel"><b>Select Role</b></label>
                                <div id="User">
                                    <input type="radio" name="role" id="UserRole" value="user">
                                    <label for="UserRole">User</label>
                                </div>
                                <div id="Administrator">
                                    <input type="radio" name="role" id="AdministratorRole" value="Admin">
                                    <label for="AdministratorRole">Administrator</label>
                                </div>
                            </div>
                            <br>
                            <div id="Terms">
                                <input type="checkbox" name="Agree" value="true">
                                <span>I agree to the <a href="Terms.html">Terms of Service</a> and <a
                                        href="Policy.html">Privacy Policy</a>.</span>
                            </div>
                            <br>
                            <div id="Register">
                                <button type="submit">Register Account</button>
                            </div>
                            <div id="Question_Form">
                                <p>Already a member?<a href="login.html"> Log in to your library</a></p>
                            </div>

                        </form>
                    </div>
                </div>
            </section>
        </main>
        <hr>



        <footer class="footer_sign">
            <small id="copyRight_F">&copy; 2025 Shelf Sync . All rights reserved. </small>
            <div id="Links_F">
                <ul>
                    <li><a href="help_Center.html" target="_blank">Help Center</a></li>
                    <li><a href="https://www.google.com/maps/place/%D8%AC%D8%A7%D9%85%D8%B9%D8%A9+%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D9%87%E2%80%AD/@30.0239249,31.2100855,1742m/data=!3m1!1e3!4m6!3m5!1s0x145846dbabc27ebd:0xa8c3715257b6f3cb!8m2!3d30.0273652!4d31.2088085!16zL20vMDJ3NmJx?entry=ttu&g_ep=EgoyMDI2MDMwOS4wIKXMDSoASAFQAw%3D%3D"
                            target="_blank">Library Location</a></li>
                    <li><a href="mailto:bodybasuni2007@gmail.com" target="_blank">Contact Support</a></li>
                </ul>
            </div>
        </footer>
    </div>
</body>

</html>
