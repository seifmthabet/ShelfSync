<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Borrow queue — ShelfSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header"><nav id="app-nav" class="nav"></nav></header>
    <main class="layout">
      <div class="page-title">
        <h1>Borrow requests</h1>
        <p class="muted">Approve to create a loan, or reject with an optional reason.</p>
      </div>
      <div class="toolbar card">
        <label>
          Status filter
          <select id="status">
            <option value="">All</option>
            <option value="pending" selected>Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <button type="button" class="btn btn--secondary" id="reload">Reload</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Reader</th>
              <th>Book</th>
              <th>Status</th>
              <th>Risk</th>
              <th>Loans</th>
              <th>When</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
    <footer class="site-footer">ShelfSync · Admin</footer>
    <script src="./js/config.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/nav.js"></script>
    <script src="./js/admin-borrows.js"></script>
  </body>
</html>
