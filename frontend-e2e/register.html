<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up — ShelfSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header"><nav id="app-nav" class="nav"></nav></header>
    <main class="layout">
      <div class="page-title">
        <h1>Create your reader profile</h1>
        <p class="muted">You will be signed in automatically after registration.</p>
      </div>
      <div class="card" style="max-width: 440px">
        <form id="reg-form" class="form" style="max-width: none">
          <label>
            Full name
            <input type="text" name="name" required minlength="2" />
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="new-password" required minlength="8" />
            <span class="field-hint">At least 8 characters, validated on the server.</span>
          </label>
          <button type="submit" class="btn" id="reg-submit">Sign up</button>
          <p class="muted" style="margin: 0">Already have an account? <a href="./login.html">Log in</a></p>
        </form>
      </div>
    </main>
    <footer class="site-footer">ShelfSync</footer>
    <script src="./js/config.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/nav.js"></script>
    <script src="./js/register.js"></script>
  </body>
</html>
