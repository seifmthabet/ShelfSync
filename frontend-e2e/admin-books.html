<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage books — ShelfSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header"><nav id="app-nav" class="nav"></nav></header>
    <main class="layout">
      <div class="page-title" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between">
        <div>
          <h1>Books</h1>
          <p class="muted">Admins see inactive titles. Category is optional (UUID from database).</p>
        </div>
        <button type="button" class="btn" id="open-create">Add book</button>
      </div>
      <div class="toolbar card">
        <label style="flex: 1; min-width: 160px">
          Search
          <input type="search" id="q" placeholder="Title or author" />
        </label>
        <button type="button" class="btn btn--secondary" id="apply">Apply</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Availability</th>
              <th>Rating</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </main>
    <dialog id="dlg" class="card">
      <div class="dialog-body">
        <h2 id="dlg-title">Book</h2>
        <form id="book-form" class="form form--wide" style="max-width: none">
          <input type="hidden" name="id" id="bf-id" />
          <label>ISBN <input type="text" name="isbn" /></label>
          <label>Title <input type="text" name="title" required /></label>
          <label>Author <input type="text" name="author" required /></label>
          <label>Category ID (UUID, optional) <input type="text" name="category" placeholder="" /></label>
          <label>Description <textarea name="description" rows="3"></textarea></label>
          <label>Publication year <input type="number" name="publication_year" min="0" /></label>
          <label>Cover URL <input type="url" name="cover_url" placeholder="https://..." /></label>
          <label>Total copies <input type="number" name="total_copies" min="0" required value="1" /></label>
          <label>Available copies <input type="number" name="available_copies" min="0" required value="1" /></label>
          <label style="display: flex; flex-direction: row; align-items: center; gap: 0.5rem">
            <input type="checkbox" name="is_active" checked />
            Visible in public catalog
          </label>
          <div class="link-row" style="margin-top: 1rem">
            <button type="submit" class="btn">Save</button>
            <button type="button" class="btn btn--ghost" id="cancel-book">Cancel</button>
          </div>
        </form>
      </div>
    </dialog>
    <footer class="site-footer">ShelfSync · Admin</footer>
    <script src="./js/config.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/nav.js"></script>
    <script src="./js/admin-books.js"></script>
  </body>
</html>
