<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile — ShelfSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header"><nav id="app-nav" class="nav"></nav></header>
    <main class="layout">
      <div class="page-title">
        <h1>Profile</h1>
        <p class="muted" id="role-line"></p>
      </div>
      <div class="card" style="margin-bottom: 1.25rem">
        <h2 style="margin-top: 0">Display name</h2>
        <form id="profile-form" class="form" style="max-width: none">
          <label>
            Name
            <input type="text" name="name" id="f-name" required />
          </label>
          <button type="submit" class="btn">Save</button>
        </form>
      </div>
      <div class="card" style="margin-bottom: 1.25rem">
        <h2 style="margin-top: 0">Change password</h2>
        <form id="pw-form" class="form" style="max-width: none">
          <label>
            Current password
            <input type="password" name="old_password" autocomplete="current-password" required />
          </label>
          <label>
            New password
            <input type="password" name="new_password" autocomplete="new-password" required minlength="8" />
          </label>
          <button type="submit" class="btn btn--secondary">Update password</button>
        </form>
      </div>
      <div class="card">
        <h2 style="margin-top: 0">Account</h2>
        <p class="muted">Deactivating signs you out; contact an admin to restore access.</p>
        <button type="button" class="btn btn--danger" id="btn-deactivate">Deactivate account</button>
      </div>
    </main>
    <footer class="site-footer">ShelfSync</footer>
    <script src="./js/config.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/nav.js"></script>
    <script src="./js/user-profile.js"></script>
  </body>
</html>
