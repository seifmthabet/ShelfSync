<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage users — ShelfSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header"><nav id="app-nav" class="nav"></nav></header>
    <main class="layout">
      <div class="page-title" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between">
        <div>
          <h1>Users</h1>
          <p class="muted">Create accounts and toggle roles (admin actions).</p>
        </div>
        <button type="button" class="btn" id="open-create">Add user</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Active</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </main>
    <dialog id="dlg" class="card">
      <div class="dialog-body">
        <h2>New user</h2>
        <form id="create-form" class="form" style="max-width: none">
          <label>Name <input type="text" name="name" required /></label>
          <label>Email <input type="email" name="email" required /></label>
          <label>Password <input type="password" name="password" required minlength="8" /></label>
          <label>
            Role
            <select name="role">
              <option value="USER">User</option>
              <option value="ADMIN">Admin</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: row; align-items: center; gap: 0.5rem">
            <input type="checkbox" name="is_active" checked />
            Active
          </label>
          <div class="link-row" style="margin-top: 1rem">
            <button type="submit" class="btn">Create</button>
            <button type="button" class="btn btn--ghost" id="cancel-create">Cancel</button>
          </div>
        </form>
      </div>
    </dialog>
    <dialog id="dlg-edit" class="card">
      <div class="dialog-body">
        <h2>Edit user</h2>
        <form id="edit-form" class="form" style="max-width: none">
          <input type="hidden" name="id" />
          <label>Name <input type="text" name="name" required /></label>
          <label>Email <input type="email" name="email" disabled /></label>
          <label>
            Role
            <select name="role">
              <option value="USER">User</option>
              <option value="ADMIN">Admin</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: row; align-items: center; gap: 0.5rem">
            <input type="checkbox" name="is_active" />
            Active
          </label>
          <div class="link-row" style="margin-top: 1rem">
            <button type="submit" class="btn">Save</button>
            <button type="button" class="btn btn--ghost" id="cancel-edit">Cancel</button>
          </div>
        </form>
      </div>
    </dialog>
    <footer class="site-footer">ShelfSync · Admin</footer>
    <script src="./js/config.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/nav.js"></script>
    <script src="./js/admin-users.js"></script>
  </body>
</html>
