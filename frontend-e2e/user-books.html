<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalog — ShelfSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header"><nav id="app-nav" class="nav"></nav></header>
    <main class="layout">
      <div class="page-title">
        <h1>Catalog</h1>
        <p class="muted">Search the collection and open a title for details, borrows, and reviews.</p>
      </div>
      <div class="toolbar card">
        <label style="flex: 1; min-width: 180px">
          Search
          <input type="search" id="q" placeholder="Title or author" />
        </label>
        <label>
          Availability
          <select id="availability">
            <option value="">Any</option>
            <option value="in_stock">In stock</option>
            <option value="out_of_stock">Out of stock</option>
          </select>
        </label>
        <label>
          Category slug
          <input type="text" id="category" placeholder="e.g. fiction" />
        </label>
        <label>
          Sort
          <select id="ordering">
            <option value="-created_at">Newest</option>
            <option value="title">Title A–Z</option>
            <option value="-average_rating">Rating</option>
          </select>
        </label>
        <button type="button" class="btn btn--secondary" id="apply-filters">Apply</button>
      </div>
      <div id="catalog" class="card-grid"></div>
      <div class="pager" id="pager"></div>
    </main>
    <footer class="site-footer">ShelfSync</footer>
    <script src="./js/config.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/nav.js"></script>
    <script src="./js/user-books.js"></script>
  </body>
</html>
