name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install tools
        run: npm install --no-save htmlhint stylelint stylelint-config-standard eslint @eslint/js

      - name: Create lint configs
        run: |
          echo '{ "src-not-empty": false }' > .htmlhintrc.json
          cat > .stylelintrc.json <<'EOF'
          {
            "extends": "stylelint-config-standard",
            "rules": {
              "alpha-value-notation": null,
              "color-function-alias-notation": null,
              "color-function-notation": null,
              "color-hex-length": null,
              "custom-property-empty-line-before": null,
              "declaration-empty-line-before": null,
              "import-notation": null
            }
          }
          EOF
          cat > eslint.config.mjs <<'EOF'
          import js from "@eslint/js";
          export default [js.configs.recommended];
          EOF

      - name: Lint HTML
        run: npx htmlhint --config .htmlhintrc.json "frontend/**/*.html"

      - name: Lint CSS
        run: npx stylelint "frontend/**/*.css" --allow-empty-input

      - name: Lint JS
        run: npx eslint "frontend/**/*.js" --no-error-on-unmatched-pattern